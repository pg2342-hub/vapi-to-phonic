name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest -v
      - name: Plan every example (no network)
        run: for f in examples/*.vapi.json; do python -m migrate plan "$f" > /dev/null; done
      - name: Demo page is built from the current mapper
        run: |
          python scripts/build_demo.py
          git diff --exit-code docs/
